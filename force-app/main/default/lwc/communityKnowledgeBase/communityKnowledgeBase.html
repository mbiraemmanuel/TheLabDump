<template>
    <div class="knowledge-base-container">
        
        
        <div class="knowledge-base-grid">
            <template if:true={isLoaded}>
                <template for:each={menuItems} for:item="menuItem">
                    <div key={menuItem.id} 
                         class="knowledge-base-item"
                         data-id={menuItem.id}
                         onclick={handleClick}>
                        <div class="icon-container">
                            <img src={menuItem.icon} 
                                 alt={menuItem.label}
                                 class="menu-icon" />
                        </div>
                        <div class="menu-label">{menuItem.label}</div>
                    </div>
                </template>
            </template>
        </div>
    </div>
</template>
