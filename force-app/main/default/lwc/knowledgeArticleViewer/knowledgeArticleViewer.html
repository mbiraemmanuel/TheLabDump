<template>
    <div class="vbu-knowledge-viewer slds-grid slds-wrap">
        <!-- LEFT COLUMN -->
        <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12 navigation-col">
            <template for:each={collectionsWithComputedProperties} for:item="collection">
                <div key={collection.id} class="collection-section">
                    <!-- Collection Header -->
                    <div class="collection-header">
                        <lightning-icon icon-name={collection.iconName} size="small"
                            class="collection-icon"></lightning-icon>
                        {collection.name}
                    </div>

                    <div class="categories-list">
                        <template for:each={collection.subcategories} for:item="subcat">
                            <div key={subcat.id} class="category-section">
                                <!-- Category Header -->
                                <button class="category-header" data-collection-id={collection.id}
                                    data-category-id={subcat.id} onclick={handleCategoryToggle}>
                                    {subcat.name}
                                    <lightning-icon icon-name={subcat.expandIconName} size="xx-small"
                                        class="expand-icon"></lightning-icon>
                                </button>

                                <!-- Articles as Radio Buttons -->
                                <div class={subcat.articlesListClass}>
                                    <template if:true={subcat.isExpanded}>
                                        <template for:each={subcat.articles} for:item="article">
                                            <div key={article.id} class="article-radio">
                                                <input type="radio" id={article.id} name="articleSelection"
                                                    value={article.id} checked={article.isSelected}
                                                    onchange={handleArticleSelection} />
                                                <label for={article.id}>{article.title}</label>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="slds-col slds-size_12-of-12 slds-medium-size_9-of-12 content-col">
            <div class="content-scroll">
                <template if:true={activeArticle}>
                    <!-- Title and Filter on same line -->
                    <div class="title-filter-container">
                        <h1>{activeArticle.Title}</h1>
                        <!-- Role Filter Button - Inline with title -->
                        <template if:true={showRoleFilter}>
                            <lightning-button 
                                variant={roleFilterButtonVariant}
                                label={roleFilterButtonLabel}
                                icon-name="utility:filter" 
                                icon-position="left"
                                onclick={toggleRoleFilter}
                                class="filter-button">
                            </lightning-button>
                        </template>
                    </div>
                    <p>{activeArticle.description}</p>
                    <c-iframe-container article-html={activeArticle.Article__c} class="article-content"></c-iframe-container>
                </template>

                <template if:false={activeArticle}>
                    <!-- Title and Filter on same line for empty state -->
                    <div class="title-filter-container">
                        <h1></h1>
                        <!-- Role Filter Button - Inline with title -->
                        <template if:true={showRoleFilter}>
                            <lightning-button 
                                variant={roleFilterButtonVariant}
                                label={roleFilterButtonLabel}
                                icon-name="utility:filter" 
                                icon-position="left"
                                onclick={toggleRoleFilter}
                                class="filter-button">
                            </lightning-button>
                        </template>
                    </div>
                    <p>Please select an article to view its content.</p>
                </template>
            </div>
        </div>

        <!-- Role Filter Modal -->
        <template if:true={isRoleFilterOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeRoleFilter}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-text-heading_medium slds-hyphenate">Filter Articles by Role</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-form-element">
                            <div class="slds-form-element__control">
                                <lightning-combobox
                                    name="role"
                                    label="Select Role"
                                    value={selectedRole}
                                    options={availableRoles}
                                    onchange={handleRoleChange}
                                    class="role-selector">
                                </lightning-combobox>
                            </div>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={closeRoleFilter}>Cancel</button>
                        <button class="slds-button slds-button_brand" onclick={applyRoleFilter}>Apply Filter</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
